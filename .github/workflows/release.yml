name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: pyinstaller MEP_CMAP_Windows.spec --clean
      - name: Zip
        shell: pwsh
        run: |
          # Zip whatever folder PyInstaller produced in dist/ (name may carry
          # the version, e.g. "MEP-CMAP Analyser v1.2"), so a version bump never
          # breaks this step again.
          $folder = Get-ChildItem -Path dist -Directory | Select-Object -First 1
          if (-not $folder) { throw "No build folder found in dist/" }
          Compress-Archive -Path $folder.FullName -DestinationPath MEP-CMAP_Analyser_Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: MEP-CMAP_Analyser_Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev binutils
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: pyinstaller MEP_CMAP_Linux.spec --clean
      - name: Tar
        run: tar -czf MEP-CMAP_Analyser_Linux.tar.gz -C dist 'MEP-CMAP Analyser'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: MEP-CMAP_Analyser_Linux.tar.gz

  build-macos:
    # Two runners, two architectures. macos-latest is Apple Silicon, so building
    # only there shipped an arm64-only app that Intel Macs could not launch at
    # all ("bad CPU type in executable"). macos-13 is the last Intel runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: intel
          - runner: macos-latest
            arch: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: pyinstaller MEP_CMAP_Mac.spec --clean
      - name: Ad-hoc code signature
        # Not Developer ID signing and NOT notarization — this does not get past
        # Gatekeeper on its own (see the macOS note in the README). It makes the
        # bundle internally consistent, which arm64 requires in order to execute
        # at all, and replaces the per-binary signatures PyInstaller leaves in a
        # mixed state. Users still need the documented first-run step.
        run: |
          codesign --force --deep --sign - "dist/MEP-CMAP Analyser.app"
          codesign --verify --deep --strict --verbose=2 "dist/MEP-CMAP Analyser.app"
      - name: Zip
        # ditto preserves bundle structure, symlinks and extended attributes;
        # plain `zip` corrupts .app bundles.
        run: ditto -c -k --keepParent "dist/MEP-CMAP Analyser.app" MEP-CMAP_Analyser_Mac_${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac-build-${{ matrix.arch }}
          path: MEP-CMAP_Analyser_Mac_${{ matrix.arch }}.zip

  release:
    # Depends on `test` as well as the builds. A successful PyInstaller build
    # only proves the code imports, not that it works, so without this a tagged
    # release published binaries and release notes even when the suite failed —
    # the same gap that was fixed for publish-pypi. Both gates now sit behind
    # the same job, including the tag/TOOL_VERSION match.
    needs: [build-windows, build-linux, build-macos, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-build/MEP-CMAP_Analyser_Windows.zip
            linux-build/MEP-CMAP_Analyser_Linux.tar.gz
            mac-build-intel/MEP-CMAP_Analyser_Mac_intel.zip
            mac-build-apple-silicon/MEP-CMAP_Analyser_Mac_apple-silicon.zip
          generate_release_notes: true

  test:
    # Real gate for the PyPI release: the wheel is pure Python, so a successful
    # PyInstaller build says nothing about whether the code works. Running the
    # suite does. Kept in this workflow (rather than depending on tests.yml)
    # because cross-workflow `needs` is not supported.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
          pip install mne || echo "MNE unavailable - parity test will skip"
      - name: Tag must match TOOL_VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import re,pathlib;print(re.search(r'TOOL_VERSION\s*=\s*[\"\']([^\"\']+)',pathlib.Path('mep_cmap/bids.py').read_text()).group(1))")
          echo "tag=$TAG  TOOL_VERSION=$VER"
          test "$TAG" = "$VER"
      - name: Version + README consistency
        run: python check_release.py
      - name: Run tests
        run: python -m pytest tests/ -q

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
