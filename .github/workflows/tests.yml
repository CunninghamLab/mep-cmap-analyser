name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and current, so the format-coverage guard runs on both.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # requirements.txt, not a hand-written subset.
        #
        # This job used to install numpy/scipy/pandas/matplotlib and nothing
        # else, so anything reaching pywt, pyedflib, neo, h5py or statsmodels at
        # import time failed here while passing both locally and in the release
        # workflow's own test job -- which does install requirements.txt. A list
        # maintained in two places drifts, and the copy that drifted was the one
        # nothing depended on, so it stayed red without blocking anything.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyflakes
          # MNE is an optional extra: it powers the reader parity check, which
          # is what originally caught the 1-based .vmrk marker bug. Without it
          # that single test skips and the rest still run.
          python -m pip install mne || echo "MNE unavailable — parity test will skip"

      - name: Run tests
        # tests/conftest.py stubs tkinter when python3-tk is unavailable, so
        # the suite runs headless without installing a GUI toolkit.
        run: python -m pytest tests/ -v --no-header
